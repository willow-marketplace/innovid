name: atlassian-twg-cli
version: 1.0.15
description: "Your code lives in your repo. The reasons behind it are spread across Jira work items, Confluence specs, pull requests, incidents, Loom videos and Slack threads. Teamwork Graph CLI (twg) gives Hermes Agent one command-line interface to that context.\n\n- One graph across your tools. Teamwork Graph maps the work items, docs, PRs, people and decisions across Jira, Confluence, Bitbucket, Jira Service Management, Loom, GitHub, Slack, Google Drive and Salesforce.\n- Built for agents. Hermes Agent runs twg commands to get structured JSON, pulling in only the context the task needs.\n- Easy to script. Output is structured JSON, so you can script it, pipe it, or use it in CI.\n- Runs as you. Commands use your Atlassian sign-in, so Hermes Agent can only access what you have permission to see.\n\nHow it works:\n1. Install the plugin.\n2. Run /twg-setup to install twg and sign in with your Atlassian account.\n3. Ask in plain English. Hermes Agent picks the right twg command and runs it.\n\nUsing Hermes in the browser? Install the Atlassian Rovo MCP plugin instead."
author: Atlassian
provides_skills:
  - twg-setup
